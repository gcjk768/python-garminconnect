[project]
name = "garmin-health-monitor"
version = "0.1.0"
description = "Self-hosted Garmin Connect -> Telegram health monitor with Ollama analysis and a heart-palpitation diary for your doctor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "gcjk768" }]
keywords = ["garmin", "telegram", "ollama", "health", "palpitations", "nas", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]
dependencies = [
    "garminconnect>=0.3.16",
    "python-telegram-bot[job-queue]>=22.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
garmin-monitor = "garmin_health_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/gcjk768/python-garminconnect"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_health_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
